# What the live fullhearts.app server{} block runs on the droplet. Three
# files: this site block, a proxy snippet, and the rate-limit zone.
#
# /etc/nginx/conf.d/fullhearts-limits.conf:
#   limit_req_zone $binary_remote_addr zone=fullhearts_api:10m rate=10r/s;
#
# /etc/nginx/snippets/fullhearts-proxy.conf (included in every location,
# because a location with any proxy_set_header of its own inherits none
# from the server block, and lib/rate-limit.ts needs the real client IP):
#   proxy_pass http://127.0.0.1:3001;
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $remote_addr;
#   proxy_set_header X-Forwarded-Proto $scheme;
#
# X-Forwarded-For is overwritten, not appended: clientIp() trusts the first
# value, so a visitor-supplied header must never get through.

location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include snippets/fullhearts-proxy.conf;
}

# Stripe retries in bursts and signs every call; no request limit here.
location /api/stripe/webhook/ {
    include snippets/fullhearts-proxy.conf;
}

location /api/ {
    limit_req zone=fullhearts_api burst=20 nodelay;
    limit_req_status 429;
    include snippets/fullhearts-proxy.conf;
}

location / {
    include snippets/fullhearts-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
