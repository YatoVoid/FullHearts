# Reverse proxy to the Node process, replacing the old static-file `root`
# directive. Drop this INSIDE your existing server{} block for fullhearts.app
# (the one that already has your TLS cert config), do not duplicate that part.

# Overwrite, don't append: a visitor can send their own X-Forwarded-For, and
# if nginx appends to it instead of replacing it, lib/rate-limit.ts's
# clientIp() (which reads the first value in the header) ends up trusting
# whatever fake IP the visitor put there. This is the single reverse proxy
# in front of the app, so overwriting with the real connecting IP is correct.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $host;

# HSTS: tell browsers to never fall back to plain HTTP for this domain.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
